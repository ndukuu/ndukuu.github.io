<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Lianne Murgor | Full-stack developer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anybody:wdth,wght@50..150,100..900&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--ink:#1B1840;--ice:#E6F1FA;--night:#15133D;--amber:#FFB547;--pink:#FF7AB6;--sky:#8FD3FF;--pw:min(32vw,50svh)}
*{box-sizing:border-box;margin:0}
html,body{height:100%;overflow:hidden;background:var(--ice);touch-action:none;-webkit-user-select:none;user-select:none;font-family:'Anybody',system-ui,sans-serif;font-variation-settings:'wdth' 100}
.stage{position:fixed;inset:0;z-index:1}
.layer{position:absolute;inset:0;display:flex;flex-direction:column;padding:clamp(14px,2.4vw,32px) clamp(20px,6vw,88px) 84px;overflow:hidden}
.light{background:radial-gradient(90% 70% at 75% 40%,#F4F9FE,var(--ice));color:var(--ink);z-index:1}
.dark{background:var(--night);color:#E7E5FF;z-index:2;font-family:'JetBrains Mono',ui-monospace,monospace;pointer-events:none;clip-path:inset(0 100% 100% 0);-webkit-clip-path:inset(0 100% 100% 0)}
.layer>*{position:relative;z-index:1}
.nav{display:flex;justify-content:space-between;align-items:center;height:56px;font-size:15px;flex:none}
.logo{font-weight:700;font-size:19px}
.links{display:flex;gap:28px}.links a{color:inherit;text-decoration:none;font-weight:500}
.grid{flex:1;display:grid;grid-template-columns:1.15fr .85fr;align-items:center;gap:4vw;min-height:0}
.pwrap{position:relative;justify-self:center;width:var(--pw)}
.portrait{position:relative;overflow:hidden;width:var(--pw);height:calc(var(--pw)*1.25);border-radius:calc(var(--pw)/2) calc(var(--pw)/2) 36px 36px;background:#c9def0}
.portrait img{width:100%;height:100%;object-fit:cover;display:block}
.tag{position:absolute;left:-28px;bottom:32px;display:flex;align-items:center;gap:9px;padding:10px 16px;border-radius:99px;background:#fff;box-shadow:0 8px 24px #1b184026;font-size:14px;font-weight:600;white-space:nowrap}
.tag i{width:9px;height:9px;border-radius:50%;background:#2fd08a;animation:pl 2s infinite}
@keyframes pl{50%{box-shadow:0 0 0 6px #2fd08a33}}
.eyebrow{font-size:15px;font-weight:500;opacity:.7;margin-bottom:14px}
.hd{font-size:clamp(40px,5.4vw,88px);line-height:1.04;font-weight:700;letter-spacing:-.02em}
.line{display:block;overflow:hidden;white-space:nowrap;padding:.1em 0 .14em;margin:-.1em 0 -.14em}
.line>span{display:block;transform:translateY(110%);animation:up .9s cubic-bezier(.2,.8,.2,1) forwards;animation-delay:calc(var(--i)*.13s + .1s)}
.ch{display:inline-block;font-variation-settings:'wdth' 40;animation:wide 1.1s cubic-bezier(.2,.8,.2,1) forwards;animation-delay:calc(var(--i)*.13s + .1s)}
.line .ch{animation-delay:inherit}
@keyframes up{to{transform:none}}@keyframes wide{to{font-variation-settings:'wdth' 100}}
.rw{position:relative;display:inline-block;perspective:500px}
.wrd{position:relative;z-index:1;display:inline-block}
.l{display:inline-block;transform-origin:50% 100%}
.hl{position:absolute;z-index:0;left:-.07em;right:-.07em;top:.2em;bottom:.02em;background:var(--amber);border-radius:.08em;transform:scaleX(0);transform-origin:left;rotate:-1.2deg}
.bio{margin:22px 0 28px;max-width:34ch;font-size:clamp(16px,1.4vw,20px);line-height:1.5}
.btns{display:flex;gap:12px;flex-wrap:wrap}
.btn{display:inline-block;padding:14px 24px;border-radius:99px;font-weight:600;font-size:15px;text-decoration:none;border:2px solid var(--ink);color:var(--ink);transition:transform .2s}
.btn:hover{transform:translateY(-2px)}.btn:focus-visible{outline:3px solid var(--amber);outline-offset:3px}
.btn.p{background:var(--ink);color:var(--ice)}
.rise{animation:rise .9s .7s both cubic-bezier(.2,.8,.2,1)}
@keyframes rise{from{opacity:0;transform:translateY(18px)}}
/* code layer */
.dots{position:absolute!important;inset:0;background-image:radial-gradient(#ffffff26 1px,transparent 1.3px);background-size:24px 24px;z-index:0!important}
.ln{position:absolute!important;left:8px;top:0;bottom:0;padding-top:14px;font-size:11px;line-height:22px;color:#8f8bd447;text-align:right;white-space:pre;z-index:0!important}
.cl{white-space:pre;font-size:clamp(12px,1.25vw,17px);line-height:1.7}.ind{padding-left:2ch}
.h1c .cl{font-size:clamp(15px,2.3vw,32px);line-height:1.35}
.pk{color:var(--pink)}.am{color:var(--amber)}.sk{color:var(--sky)}.cm{color:#7f7bbd}
.dark .bio{margin:20px 0 26px;max-width:none}
.dark .btn{border-color:currentColor;background:none;font-size:clamp(12px,1.1vw,15px);padding:15px 22px}
.dark .tag{background:#221f5c;border:1px solid var(--amber);color:var(--amber);box-shadow:none;font-weight:400;font-size:13px}
.dark .portrait{background:#0d0b2c;box-shadow:inset 0 0 0 1px #8FD3FF44}
#asc{width:100%;height:100%;display:block}
.scan{position:absolute;left:0;right:0;top:0;height:3px;background:linear-gradient(90deg,transparent,var(--pink),transparent);box-shadow:0 0 14px var(--pink);animation:scan 3.2s linear infinite}
@keyframes scan{to{transform:translateY(calc(var(--pw)*1.25))}}
#fx{position:fixed;inset:0;width:100%;height:100%;z-index:3;pointer-events:none}
.hint{position:fixed;z-index:4;left:50%;bottom:calc(22px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);padding:10px 18px;border-radius:99px;background:var(--ink);color:var(--ice);border:1px solid #FFB54780;font:400 12px 'JetBrains Mono',monospace;white-space:nowrap;transition:opacity .6s;pointer-events:none}
.info{position:fixed;inset:0;z-index:6;display:grid;place-items:center;padding:24px;background:#15133d99;opacity:0;visibility:hidden;pointer-events:none;transition:opacity .25s,visibility .25s}
.info.open{opacity:1;visibility:visible;pointer-events:auto}
.info-card{position:relative;width:min(620px,100%);max-height:min(720px,calc(100svh - 48px));overflow:auto;padding:clamp(26px,5vw,52px);background:var(--ice);color:var(--ink);border:2px solid var(--ink);box-shadow:12px 12px 0 var(--amber);transform:translateY(16px);transition:transform .3s cubic-bezier(.2,.8,.2,1)}
.info.open .info-card{transform:none}
.info-kicker{margin-bottom:12px;color:#665e9d;font:600 12px 'JetBrains Mono',monospace;text-transform:uppercase;letter-spacing:.08em}
.info-title{max-width:12ch;font-size:clamp(32px,5vw,58px);line-height:1.02;letter-spacing:-.02em}
.info-copy{margin-top:20px;max-width:52ch;font-size:17px;line-height:1.6}
.info-list{display:grid;gap:12px;margin-top:24px;padding:0;list-style:none}
.info-list li{padding:14px 16px;background:#fff;border-left:5px solid var(--pink);font-size:15px;line-height:1.45}
.info-close{position:absolute;top:16px;right:16px;width:38px;height:38px;border:2px solid var(--ink);border-radius:50%;background:transparent;color:var(--ink);font:600 22px/1 'JetBrains Mono',monospace;cursor:pointer}
.info-close:hover{background:var(--ink);color:var(--ice)}.info-close:focus-visible{outline:3px solid var(--pink);outline-offset:3px}
@media(max-width:719px){.info{padding:16px}.info-card{max-height:calc(100svh - 32px);box-shadow:7px 7px 0 var(--amber)}.info-copy{font-size:15px}}
@media(max-width:719px){
.links{display:none}
.grid{display:flex;flex-direction:column;justify-content:center;gap:18px;align-items:stretch}
.pwrap{order:-1;align-self:flex-end;--pw:min(46vw,27svh)}
.hd{font-size:8.4vw}.h1c .cl{font-size:3.7vw}.cl{font-size:3.1vw}
.tag{left:-16px;bottom:20px;font-size:12px;padding:8px 12px}
.eyebrow{font-size:13px;margin-bottom:10px}.bio{margin:16px 0 20px}
.dark .btn{padding:13px 16px;font-size:3vw}
}
@media(prefers-reduced-motion:reduce){
.line>span,.ch,.rise{animation:none!important;transform:none!important;font-variation-settings:'wdth' 100!important}
.scan,.tag i{animation:none}
}
</style>
</head>
<body>
<div class="stage"><section class="layer light" id="light"></section><section class="layer dark" id="dark" aria-hidden="true"></section></div>
<canvas id="fx"></canvas>
<div class="hint" id="hint"></div>
<section class="info" id="info" aria-hidden="true" aria-labelledby="info-title" role="dialog">
<div class="info-card">
<button class="info-close" id="info-close" type="button" aria-label="Close information">&times;</button>
<p class="info-kicker" id="info-kicker"></p><h2 class="info-title" id="info-title"></h2><p class="info-copy" id="info-copy"></p><ul class="info-list" id="info-list"></ul>
</div>
</section>

const info=$('#info'),infoTitle=$('#info-title'),infoKicker=$('#info-kicker'),infoCopy=$('#info-copy'),infoList=$('#info-list'),infoClose=$('#info-close');
let lastFocus;
function openInfo(key){const content=INFO[key];if(!content)return;lastFocus=document.activeElement;infoKicker.textContent=content.kicker;infoTitle.textContent=content.title;infoCopy.textContent=content.copy;infoList.innerHTML=content.items.map(item=>`<li>${item}</li>`).join('');info.classList.add('open');info.setAttribute('aria-hidden','false');infoClose.focus()}
function closeInfo(){info.classList.remove('open');info.setAttribute('aria-hidden','true');if(lastFocus)lastFocus.focus()}

/* ---- rotating word ---- */
const sleep=ms=>new Promise(r=>setTimeout(r,ms)),rw=$('#rw'),wrd=rw.querySelector('.wrd'),hl=rw.querySelector('.hl'),W=K.words;
const setWord=(w,hide)=>{wrd.innerHTML=[...w].map(c=>`<span class="l"${hide?' style="opacity:0"':''}>${c}</span>`).join('');document.querySelectorAll('.cw').forEach(e=>e.textContent=w)};
function land(){
  [...wrd.children].forEach((l,k)=>l.animate([{transform:'translateY(110%)',opacity:0},{transform:'none',opacity:1}],{duration:650,delay:k*55,easing:'cubic-bezier(.3,1.7,.5,1)',fill:'both'}));
  setTimeout(()=>hl.animate([{transformOrigin:'left',transform:'scaleX(0)'},{transformOrigin:'left',transform:'scaleX(1)'}],{duration:520,easing:'cubic-bezier(.6,0,.2,1)',fill:'forwards'}),380);
}
async function out(){
  const p=[hl.animate([{transformOrigin:'right',transform:'scaleX(1)'},{transformOrigin:'right',transform:'scaleX(0)'}],{duration:380,easing:'ease-in',fill:'forwards'}).finished];
  [...wrd.children].forEach((l,k)=>p.push(l.animate([{transform:'none',opacity:1,filter:'blur(0)'},{transform:'translateY(-80%) rotateX(85deg)',opacity:0,filter:'blur(7px)'}],{duration:420,delay:k*45,easing:'ease-in',fill:'forwards'}).finished));
  await Promise.all(p);
}
(async()=>{
  if(RM){setWord(W[0]);hl.style.transform='scaleX(1)';return}
  setWord(W[0],true);await sleep(1200);land();
  for(let i=1;;i++){await sleep(2000);await out();setWord(W[i%W.length],true);land()}
})();

  g.drawImage(ph,(iw-sw)/2,(ih-sh)*.25,sw,sh,0,0,AC,AR);
  const d=g.getImageData(0,0,AC,AR).data;gray=new Float32Array(AC*AR);
  const lum=i=>(.3*d[i*4]+.59*d[i*4+1]+.11*d[i*4+2])/255,cs=[0,AC-1,AC*(AR-1),AC*AR-1],inv=cs.reduce((a,i)=>a+lum(i),0)/4>.6;
  for(let i=0;i<gray.length;i++){let v=lum(i);if(inv)v=1-v;gray[i]=Math.min(1,Math.max(0,(v-.35)*1.7+.35))}
}
function drawAscii(){
  if(!gray)return;ac.setTransform(adp,0,0,adp,0,0);ac.clearRect(0,0,pw,ph_);ac.font='11.5px JetBrains Mono,monospace';ac.textBaseline='top';
  let last='';
  for(let y=0;y<AR;y++)for(let x=0;x<AC;x++){
    let v=gray[y*AC+x];if(!RM)v+=(Math.random()-.5)*.24;v=v<0?0:v>1?1:v;
    const k=v*9.99|0;if(!k)continue;
    const c=v<.3?'rgba(143,211,255,.35)':v<.6?'#8FD3FF':v<.8?'#FF7AB6':'#FFB547';
    if(c!==last){ac.fillStyle=c;last=c}
    ac.fillText(RAMP[k],x*CW,y*CH);
  }
}
const setPhoto=src=>{ph.src=src};
ph.onload=()=>{sample();drawAscii()};
setPhoto(K.photo||fallback());
addEventListener('dragover',e=>e.preventDefault());
addEventListener('drop',e=>{e.preventDefault();const f=e.dataTransfer.files[0];if(f&&f.type.startsWith('image/')){const r=new FileReader();r.onload=()=>setPhoto(r.result);r.readAsDataURL(f)}});

/* ---- liquid blob (metaballs + marching squares) ---- */
let Wd,Ht,dpr,CS,C,Rw,F,R,px=0,py=0,lx=0,ly=0,vx=0,vy=0,touched=false,pulse=0,drops=[],segs=[],lastA=0;
function size(){
  Wd=innerWidth;Ht=innerHeight;dpr=Math.min(devicePixelRatio||1,coarse?1.5:2);
  cv.width=Wd*dpr;cv.height=Ht*dpr;CS=Wd<720?10:8;C=Math.ceil(Wd/CS)+2;Rw=Math.ceil(Ht/CS)+2;F=new Float32Array(C*Rw);
  R=Wd<720?58:Math.round(Math.min(96,Math.max(70,Wd*.058)));
}
function rest(){const r=ph.getBoundingClientRect();px=lx=r.left+r.width/2;py=ly=r.top+r.height*.55}
function poke(e){px=e.clientX;py=e.clientY;if(!touched){touched=true;lx=px;ly=py;vx=vy=0;$('#hint').style.opacity=.5}}
addEventListener('pointermove',poke,{passive:true});
addEventListener('pointerdown',e=>{poke(e);splash()},{passive:true});
function splash(){
  if(RM)return;pulse=.9;
  for(let k=0;k<12&&drops.length<26;k++){const a=Math.random()*6.283,s=4+Math.random()*7;drops.push({x:px+Math.cos(a)*R*.6,y:py+Math.sin(a)*R*.6,vx:Math.cos(a)*s,vy:Math.sin(a)*s,r:8+Math.random()*5,a:0})}
}
function cell(i,j,a,b,c,e){
  const x=i*CS,y=j*CS,X=x+CS,Y=y+CS,vs=[a,b,c,e],xs=[x,X,X,x],ys=[y,y,Y,Y],q=[];let s='',f=true;
  for(let k=0;k<4;k++){const n=(k+1)&3;
    if(vs[k]>=1){s+=(f?'M':'L')+xs[k]+' '+ys[k];f=false}
    if((vs[k]>=1)!==(vs[n]>=1)){const t=(1-vs[k])/(vs[n]-vs[k]),qx=xs[k]+(xs[n]-xs[k])*t,qy=ys[k]+(ys[n]-ys[k])*t;s+=(f?'M':'L')+qx.toFixed(1)+' '+qy.toFixed(1);f=false;q.push(qx,qy)}}
  if(q.length>=4)segs.push(q[0],q[1],q[2],q[3]);if(q.length>=8)segs.push(q[4],q[5],q[6],q[7]);
  return s+'Z';
}
function frame(ts){
  requestAnimationFrame(frame);const t=ts/1000;
  vx=vx*.75+(px-lx)*.25;vy=vy*.75+(py-ly)*.25;lx=px;ly=py;
  const sp=Math.hypot(vx,vy);pulse*=.92;F.fill(0);
  let b0=1e9,b1=1e9,b2=-1e9,b3=-1e9;
  const add=(x,y,r)=>{
    const ex=r*2.6,ia=Math.max(0,(x-ex)/CS|0),ib=Math.min(C-1,(x+ex)/CS+1|0),ja=Math.max(0,(y-ex)/CS|0),jb=Math.min(Rw-1,(y+ex)/CS+1|0),r2=r*r;
    for(let j=ja;j<=jb;j++){const dy=j*CS-y;for(let i=ia;i<=ib;i++){const dx=i*CS-x;F[j*C+i]+=r2/(dx*dx+dy*dy+1)}}
    b0=Math.min(b0,x-ex);b1=Math.min(b1,y-ex);b2=Math.max(b2,x+ex);b3=Math.max(b3,y+ex);
  };
  add(px,py,R*(1+pulse*.3));
  if(!RM){
    for(let k=0;k<5;k++){const a=k*1.2566+t*.9,d=R*(.74+.05*Math.sin(t*2.1+k*1.7));add(px+Math.cos(a)*d,py+Math.sin(a)*d,R*.4)}
    if(sp>.6){const k=Math.min(1,sp/9),Ln=Math.min(sp*3.4,R*1.9),ux=-vx/sp,uy=-vy/sp;add(px+ux*Ln*.45,py+uy*Ln*.45,R*.85*k);add(px+ux*Ln*.9,py+uy*Ln*.9,R*.55*k+2)}
    if(sp>16&&drops.length<14&&Math.random()<.4){const a=Math.random()*6.283;drops.push({x:px+Math.cos(a)*R,y:py+Math.sin(a)*R,vx:vx*.5+Math.random()*4-2,vy:vy*.5+Math.random()*4-2,r:8+Math.random()*5,a:0})}
    for(let i=drops.length-1;i>=0;i--){
      const d=drops[i];d.a+=.016;d.x+=d.vx;d.y+=d.vy;d.vx*=.95;d.vy*=.95;
      const ax=px-d.x,ay=py-d.y,dist=Math.hypot(ax,ay)||1;
      if(d.a>.28){const g=.55+(d.a-.28)*.6;d.vx+=ax/dist*g;d.vy+=ay/dist*g}
      if((dist<R*.9&&d.a>.28)||d.a>3){drops.splice(i,1);pulse=Math.min(pulse+.1,.4);continue}
      add(d.x,d.y,d.r);
    }
  }
  /* marching squares -> clip path for code layer + rim segments */
  segs.length=0;let d='';
  const i0=Math.max(0,b0/CS|0),i1=Math.min(C-2,b2/CS|0),j0=Math.max(0,b1/CS|0),j1=Math.min(Rw-2,b3/CS|0);
  for(let j=j0;j<=j1;j++){
    let run=-1;const y=j*CS;
    for(let i=i0;i<=i1+1;i++){
      let full=false,part=false,a,b,c,e;
      if(i<=i1){const k=j*C+i;a=F[k];b=F[k+1];c=F[k+C+1];e=F[k+C];
        full=a>=1&&b>=1&&c>=1&&e>=1;part=!full&&(a>=1||b>=1||c>=1||e>=1)}
      if(full){if(run<0)run=i;continue}
      if(run>=0){d+=`M${run*CS} ${y}H${i*CS}V${y+CS}H${run*CS}Z`;run=-1}
      if(part)d+=cell(i,j,a,b,c,e);
    }
  }
  const cp=d?`path('${d}')`:'inset(0 100% 100% 0)';dark.style.clipPath=cp;dark.style.webkitClipPath=cp;
  /* rim + gloss */
  cx.setTransform(dpr,0,0,dpr,0,0);cx.clearRect(0,0,Wd,Ht);
  if(segs.length){
    cx.lineCap='round';cx.beginPath();
    for(let i=0;i<segs.length;i+=4){cx.moveTo(segs[i],segs[i+1]);cx.lineTo(segs[i+2],segs[i+3])}
    cx.strokeStyle='rgba(255,181,71,.28)';cx.lineWidth=8;cx.stroke();cx.strokeStyle='#FFB547';cx.lineWidth=2.6;cx.stroke();
    cx.save();cx.translate(px-R*.38,py-R*.42);cx.rotate(-.6);cx.scale(1,.5);
    const g=cx.createRadialGradient(0,0,0,0,0,R*.32);g.addColorStop(0,'rgba(255,255,255,.75)');g.addColorStop(1,'rgba(255,255,255,0)');
    cx.fillStyle=g;cx.beginPath();cx.arc(0,0,R*.32,0,7);cx.fill();cx.restore();
  }
  /* ASCII only near portrait, throttled */
  if(t-lastA>.075&&Math.abs(px-pcx)<pw/2+R*1.6&&Math.abs(py-pcy)<ph_/2+R*1.6){drawAscii();lastA=t}
}
size();
addEventListener('resize',()=>{size();sample();if(!touched)rest();drawAscii()});
(document.fonts?document.fonts.ready:Promise.resolve()).then(()=>{sample();if(!touched)rest()});
rest();requestAnimationFrame(frame);
</script>
</body>
